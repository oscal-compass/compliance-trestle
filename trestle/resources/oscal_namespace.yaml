      oscal-ssp:
        (.|statement|.//by-component)/prop:
          (.|statement|.//by-component)/prop[@name]:
            allowed_values:
            - control-origination
            allow_other: false
            definitions:
            - value: control-origination
              description: Identifies the source of the implemented control.  Any control-origination prop defined in a child
                context will override the parent value.
            constraint_ids:
            - oscal-implemented-requirement-statement-by-component-prop-name-values
            source_files:
            - oscal_ssp_metaschema_RESOLVED.xml
          (.|statement|.//by-component)/prop[@value] where name=control-origination:
            allowed_values:
            - organization
            - system-specific
            - customer-configured
            - customer-provided
            - inherited
            allow_other: false
            definitions:
            - value: organization
              description: The control is implemented by the organization owning the system, but is not specific to the system
                itself.
            - value: system-specific
              description: The control is implemented specifically to this system.
            - value: customer-configured
              description: The control is provided by the system, but must be configured by the customer.
            - value: customer-provided
              description: The control must be implemented by the customer.
            - value: inherited
              description: This control is inherited from an underlying system.
            constraint_ids:
            - oscal-implemented-requirement-statement-by-component-prop-control-origination-values
