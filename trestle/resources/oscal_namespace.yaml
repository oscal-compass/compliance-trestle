oscal_namespace:
  version: 1.2.2
  description: OSCAL default namespace vocabulary extracted from metaschemas
  namespaces:
    http://csrc.nist.gov/ns/oscal:
      oscal-ap:
        assessment-plan/part:
          assessment-plan/part[@name]:
            allowed_values:
            - rules-of-engagement
            - disclosures
            - assessment-inclusions
            - assessment-exclusions
            - results-delivery
            - assumptions
            - methodology
            allow_other: false
            definitions:
            - value: rules-of-engagement
              description: Defines the circumstances, conditions, degree, and manner in which the use of cyber-attack techniques
                or actions may be applied to the assessment.
            - value: disclosures
              description: Any information the assessor should make known to the system owner or authorizing official. Has
                child 'item' parts for each individual disclosure.
            - value: assessment-inclusions
              description: Defines any assessment activities which the system owner or authorizing official wishes to ensure
                are performed as part of the assessment.
            - value: assessment-exclusions
              description: Defines any assessment activities which the system owner or authorizing official explicitly prohibits
                from being performed as part of the assessment.
            - value: results-delivery
              description: Defines conditions related to the delivery of the assessment results, such as when to deliver,
                how, and to whom.
            - value: assumptions
              description: Defines any supposition made by the assessor. Has child 'item' parts for each assumption.
            - value: methodology
              description: An explanation of practices, procedures, and rules used in the course of the assessment.
            constraint_ids:
            - oscal-terms-and-conditions-part-name
            source_files:
            - oscal_assessment-plan_metaschema_RESOLVED.xml
      oscal-assessment-common:
        '@name=''objective'']/prop':
          '@name=''objective'']/prop[@name]':
            allowed_values:
            - method
            allow_other: false
            definitions:
            - value: method
              description: The assessment method to use. This typically appears on parts with the name "objective".
            constraint_ids:
            - oscal-assesment-part-objective-name
            source_files:
            - oscal_assessment-common_metaschema_RESOLVED.xml
          '@name=''objective'']/prop[@value] where name=method':
            allowed_values:
            - INTERVIEW
            - EXAMINE
            - TEST
            allow_other: false
            definitions:
            - value: INTERVIEW
              description: The process of holding discussions with individuals or groups of individuals within an organization
                to once again, facilitate assessor understanding, achieve clarification, or obtain evidence.
            - value: EXAMINE
              description: The process of reviewing, inspecting, observing, studying, or analyzing one or more assessment
                objects (i.e., specifications, mechanisms, or activities).
            - value: TEST
              description: The process of exercising one or more assessment objects (i.e., activities or mechanisms) under
                specified conditions to compare actual with expected behavior.
            constraint_ids:
            - oscal-assesment-part-objective-method-value
            source_files:
            - oscal_assessment-common_metaschema_RESOLVED.xml
            conditions:
              name: method
        activity/prop:
          activity/prop[@name]:
            allowed_values:
            - method
            allow_other: false
            definitions:
            - value: method
              description: The assessment method to use. This typically appears on parts with the name "assessment".
            constraint_ids:
            - oscal-activity-values
            source_files:
            - oscal_assessment-common_metaschema_RESOLVED.xml
          activity/prop[@value] where name=method:
            allowed_values:
            - INTERVIEW
            - EXAMINE
            - TEST
            allow_other: false
            definitions:
            - value: INTERVIEW
              description: The process of holding discussions with individuals or groups of individuals within an organization
                to once again, facilitate assessor understanding, achieve clarification, or obtain evidence.
            - value: EXAMINE
              description: The process of reviewing, inspecting, observing, studying, or analyzing one or more assessment
                objects (i.e., specifications, mechanisms, or activities).
            - value: TEST
              description: The process of exercising one or more assessment objects (i.e., activities or mechanisms) under
                specified conditions to compare actual with expected behavior.
            constraint_ids:
            - oscal-activity-type-values
            source_files:
            - oscal_assessment-common_metaschema_RESOLVED.xml
            conditions:
              name: method
        characterization/prop:
          characterization/prop[@name]:
            allowed_values:
            - state
            allow_other: false
            definitions:
            - value: state
              description: Indicates if the facet is 'initial' as first identified, or 'adjusted' indicating that the value
                has be changed after some adjustments have been made (e.g., to identify residual risk).
            constraint_ids:
            - oscal-facet-prop-name-values
            source_files:
            - oscal_assessment-common_metaschema_RESOLVED.xml
          characterization/prop[@value] where name=state:
            allowed_values:
            - initial
            - adjusted
            allow_other: false
            definitions:
            - value: initial
              description: As first identified.
            - value: adjusted
              description: Indicates that residual risk remains after some adjustments have been made.
            constraint_ids:
            - oscal-facet-prop-state-values
            source_files:
            - oscal_assessment-common_metaschema_RESOLVED.xml
            conditions:
              name: state
        local-objective/part:
          local-objective/part[@name]:
            allowed_values:
            - objective
            - assessment
            - assessment-objective
            - assessment-method
            allow_other: false
            definitions:
            - value: objective
              description: '**(deprecated)** Use ''assessment-objective'' instead.'
              deprecated: 1.0.1
            - value: assessment
              description: '**(deprecated)** Use ''assessment-method'' instead.'
              deprecated: 1.0.1
            - value: assessment-objective
              description: The part defines an assessment objective.
            - value: assessment-method
              description: The part defines an assessment method.
            constraint_ids:
            - oscal-assessment-objective-types
            source_files:
            - oscal_assessment-common_metaschema_RESOLVED.xml
        response/prop:
          response/prop[@name]:
            allowed_values:
            - type
            allow_other: false
            definitions:
            - value: type
              description: Risk Response Type
            constraint_ids:
            - oscal-response-prop-name
            source_files:
            - oscal_assessment-common_metaschema_RESOLVED.xml
          response/prop[@value] where name=type:
            allowed_values:
            - avoid
            - mitigate
            - transfer
            - accept
            - share
            - contingency
            - none
            allow_other: false
            definitions:
            - value: avoid
              description: The risk will be eliminated.
            - value: mitigate
              description: The risk will be reduced.
            - value: transfer
              description: The risk will be transferred to another organization or entity.
            - value: accept
              description: The risk will continue to exist without further efforts to address it. (Sometimes referred to as
                "Operationally required")
            - value: share
              description: The risk will be partially transferred to another organization or entity.
            - value: contingency
              description: Plans will be made to address the risk impact if the risk occurs. (This is a form of mitigation.)
            - value: none
              description: No response, such as when the identified risk is found to be a false positive.
            constraint_ids:
            - oscal-response-prop-type-value
            source_files:
            - oscal_assessment-common_metaschema_RESOLVED.xml
            conditions:
              name: type
        risk/prop:
          risk/prop[@name]:
            allowed_values:
            - type
            - false-positive
            - accepted
            - risk-adjusted
            - priority
            allow_other: false
            definitions:
            - value: type
              description: The type of remediation tracking entry. Can be multi-valued.
            - value: false-positive
              description: The risk has been confirmed to be a false positive.
            - value: accepted
              description: The risk has been accepted. No further action will be taken.
            - value: risk-adjusted
              description: The risk has been adjusted.
            - value: priority
              description: A numeric value indicating the sequence in which risks should be addressed. (Lower numbers are
                higher priority)
            constraint_ids:
            - oscal-risk-prop-name-values
            - oscal-risk-prop-name-values
            source_files:
            - oscal_assessment-common_metaschema_RESOLVED.xml
          risk/prop[@value] where name=type:
            allowed_values:
            - vendor-check-in
            - status-update
            - milestone-complete
            - mitigation
            - remediated
            - closed
            - dr-submission
            - dr-updated
            - dr-approved
            - dr-rejected
            allow_other: true
            definitions:
            - value: vendor-check-in
              description: Contacted vendor to determine the status of a pending fix to a known vulnerability.
            - value: status-update
              description: Information related to the current state of response to this risk.
            - value: milestone-complete
              description: A significant step in the response plan has been achieved.
            - value: mitigation
              description: An activity was completed that reduces the likelihood or impact of this risk.
            - value: remediated
              description: An activity was completed that eliminates the likelihood or impact of this risk.
            - value: closed
              description: The risk is no longer applicable to the system.
            - value: dr-submission
              description: A deviation request was made to the authorizing official.
            - value: dr-updated
              description: A previously submitted deviation request has been modified.
            - value: dr-approved
              description: The authorizing official approved the deviation.
            - value: dr-rejected
              description: The authorizing official rejected the deviation.
            constraint_ids:
            - oscal-risk-prop-type-values
            source_files:
            - oscal_assessment-common_metaschema_RESOLVED.xml
            conditions:
              name: type
      oscal-catalog:
        .//part:
          .//part[@name]:
            allowed_values:
            - objective
            - assessment-objective
            allow_other: false
            definitions:
            - value: objective
              description: "**(deprecated)** Use\n                              'assessment-objective' instead."
              deprecated: 1.0.1
            - value: assessment-objective
              description: "The part describes a set of assessment\n                              objectives."
            constraint_ids:
            - oscal-control-statement-part-name
            source_files:
            - oscal_catalog_metaschema_RESOLVED.xml
        control/part:
          control/part[@name]:
            allowed_values:
            - overview
            - statement
            - guidance
            - example
            - assessment
            - assessment-method
            allow_other: false
            definitions:
            - value: overview
              description: "An introduction to a control or a group of\n                              controls."
            - value: statement
              description: A set of implementation requirements or recommendations.
            - value: guidance
              description: "Additional information to consider when selecting,\n                              implementing,\
                \ assessing, and monitoring a control."
            - value: example
              description: An example of an implemented requirement or control statement.
            - value: assessment
              description: "**(deprecated)** Use\n                              'assessment-method' instead."
              deprecated: 1.0.1
            - value: assessment-method
              description: "The part describes a method-based assessment\n                              over a set of assessment\
                \ objects."
            constraint_ids:
            - oscal-control-part-name
            source_files:
            - oscal_catalog_metaschema_RESOLVED.xml
        control/prop:
          control/prop[@name]:
            allowed_values:
            - label
            - sort-id
            - alt-identifier
            - status
            allow_other: false
            definitions:
            - value: label
              description: A human-readable label for the parent context, which may be rendered in place of the actual identifier
                for some use cases.
            - value: sort-id
              description: An alternative identifier, whose value is easily sortable among other such values in the document.
            - value: alt-identifier
              description: An alternate or aliased identifier for the parent context.
            - value: status
              description: "The status of a control. For example, a\n                              value of 'withdrawn' can\
                \ indicate that the control has\n                              been withdrawn and should no longer be used."
            constraint_ids:
            - oscal-control-prop-name
            source_files:
            - oscal_catalog_metaschema_RESOLVED.xml
          control/prop[@value] where name=status:
            allowed_values:
            - withdrawn
            - Withdrawn
            allow_other: false
            definitions:
            - value: withdrawn
              description: The control is no longer used.
            - value: Withdrawn
              description: "**(deprecated)*** Use 'withdrawn'\n                              instead."
              deprecated: 1.0.0
            constraint_ids:
            - oscal-control-prop-status-value
            source_files:
            - oscal_catalog_metaschema_RESOLVED.xml
            conditions:
              name: status
        group/part:
          group/part[@name]:
            allowed_values:
            - overview
            - instruction
            allow_other: false
            definitions:
            - value: overview
              description: An introduction to a control or a group of controls.
            - value: instruction
              description: Information providing directions for a control or a group of controls.
            constraint_ids:
            - oscal-group-part-name
            source_files:
            - oscal_catalog_metaschema_RESOLVED.xml
        group/prop:
          group/prop[@name]:
            allowed_values:
            - label
            - sort-id
            - alt-identifier
            allow_other: false
            definitions:
            - value: label
              description: A human-readable label for the parent context, which may be rendered in place of the actual identifier
                for some use cases.
            - value: sort-id
              description: An alternative identifier, whose value is easily sortable among other such values in the document.
            - value: alt-identifier
              description: An alternate or aliased identifier for the parent context.
            constraint_ids:
            - oscal-group-prop-name
            source_files:
            - oscal_catalog_metaschema_RESOLVED.xml
        has-oscal-namespace('http://csrc.nist.gov/ns/oscal') and @name='statement']//part:
          has-oscal-namespace('http://csrc.nist.gov/ns/oscal') and @name='statement']//part[@name]:
            allowed_values:
            - item
            allow_other: false
            definitions:
            - value: item
              description: An individual item within a control statement.
            constraint_ids:
            - oscal-control-statement-part-subpart-name
            source_files:
            - oscal_catalog_metaschema_RESOLVED.xml
        has-oscal-namespace('http://csrc.nist.gov/ns/oscal') and @name=('assessment','assessment-method')]/part:
          has-oscal-namespace('http://csrc.nist.gov/ns/oscal') and @name=('assessment','assessment-method')]/part[@name]:
            allowed_values:
            - objects
            - assessment-objects
            allow_other: false
            definitions:
            - value: objects
              description: "**(deprecated)** Use\n                              'assessment-objects' instead."
              deprecated: 1.0.1
            - value: assessment-objects
              description: "Provides a listing of assessment\n                              objects."
            constraint_ids:
            - oscal-control-objective-part-subpart-name
            source_files:
            - oscal_catalog_metaschema_RESOLVED.xml
        has-oscal-namespace('http://csrc.nist.gov/ns/oscal') and @name=('assessment','assessment-method')]/prop:
          has-oscal-namespace('http://csrc.nist.gov/ns/oscal') and @name=('assessment','assessment-method')]/prop[@name]:
            allowed_values:
            - method
            allow_other: false
            definitions:
            - value: method
              description: '**(deprecated)** Use ''method'' in the ''http://csrc.nist.gov/ns/rmf'' namespace. The assessment
                method to use. This typically appears on parts with the name "assessment-method".'
              deprecated: 1.0.1
            constraint_ids:
            - oscal-control-statement-part-prop-name
            - oscal-control-statement-part-rmf-prop-name
            source_files:
            - oscal_catalog_metaschema_RESOLVED.xml
          ? has-oscal-namespace('http://csrc.nist.gov/ns/oscal') and @name=('assessment','assessment-method')]/prop[@value]
            where name=method
          : allowed_values:
            - INTERVIEW
            - EXAMINE
            - TEST
            allow_other: false
            definitions:
            - value: INTERVIEW
              description: The process of holding discussions with individuals or groups of individuals within an organization
                to once again, facilitate assessor understanding, achieve clarification, or obtain evidence.
            - value: EXAMINE
              description: The process of reviewing, inspecting, observing, studying, or analyzing one or more assessment
                objects (i.e., specifications, mechanisms, or activities).
            - value: TEST
              description: The process of exercising one or more assessment objects (i.e., activities or mechanisms) under
                specified conditions to compare actual with expected behavior.
            constraint_ids:
            - oscal-control-objective-part-method-prop-value
            source_files:
            - oscal_catalog_metaschema_RESOLVED.xml
            conditions:
              name: method
        metadata/prop:
          metadata/prop[@name]:
            allowed_values:
            - resolution-tool
            - source-profile-uuid
            allow_other: false
            definitions:
            - value: resolution-tool
              description: The tool used to produce a resolved profile.
            - value: source-profile-uuid
              description: The document-level uuid of the source profile from which the catalog was produced by profile resolution.
            constraint_ids:
            - oscal-catalog-metadata-prop-name
            source_files:
            - oscal_catalog_metaschema_RESOLVED.xml
      oscal-component-definition:
        '@type=''software'']/prop':
          '@type=''software'']/prop[@name]':
            allowed_values:
            - software-identifier
            allow_other: false
            definitions:
            - value: software-identifier
              description: If a "software" component-type, the identifier, such as a SWID tag, for the software component.
            constraint_ids:
            - oscal-software-component-prop-name
            source_files:
            - oscal_component_metaschema_RESOLVED.xml
        defined-component/prop:
          defined-component/prop[@name]:
            allowed_values:
            - version
            - patch-level
            - model
            - release-date
            - validation-type
            - validation-reference
            - asset-type
            - asset-id
            - asset-tag
            - public
            - virtual
            - vlan-id
            - network-id
            - label
            - sort-id
            - baseline-configuration-name
            - allows-authenticated-scan
            - function
            - hardware-model
            - os-name
            - os-version
            - software-name
            - software-version
            - software-patch-level
            allow_other: false
            definitions:
            - value: version
              description: The version of the component.
            - value: patch-level
              description: The specific patch level of the component.
            - value: model
              description: The model of the component.
            - value: release-date
              description: The date the component was released, such as a software release date or policy publication date.
            - value: validation-type
              description: Used with component-type='validation' to provide a well-known name for a kind of validation.
            - value: validation-reference
              description: Used with component-type='validation' to indicate the validating body's assigned identifier for
                their validation of this component.
            - value: asset-type
              description: Simple indication of the asset's function, such as Router, Storage Array, DNS Server.
            - value: asset-id
              description: An organizationally specific identifier that is used to uniquely identify a logical or tangible
                item by the organization that owns the item.
            - value: asset-tag
              description: An asset tag assigned by the organization responsible for maintaining the logical or tangible item.
            - value: public
              description: Identifies whether the asset is publicly accessible (yes/no)
            - value: virtual
              description: Identifies whether the asset is virtualized (yes/no)
            - value: vlan-id
              description: Virtual LAN identifier of the asset.
            - value: network-id
              description: The network identifier of the asset.
            - value: label
              description: A human-readable label for the parent context.
            - value: sort-id
              description: An alternative identifier, whose value is easily sortable among other such values in the document.
            - value: baseline-configuration-name
              description: The name of the baseline configuration for the asset.
            - value: allows-authenticated-scan
              description: Can the asset be check with an authenticated scan? (yes/no)
            - value: function
              description: The function provided by the asset for the system.
            - value: hardware-model
              description: '**(deprecated)** Use ''model'' instead.'
              deprecated: 1.2.0
            - value: os-name
              description: The name of the operating system used by the asset.
            - value: os-version
              description: The version of the operating system used by the asset.
            - value: software-name
              description: The software product name used by the asset.
            - value: software-version
              description: The software product version used by the asset.
            - value: software-patch-level
              description: The software product patch level used by the asset.
            constraint_ids:
            - oscal-component-prop-name
            source_files:
            - oscal_component_metaschema_RESOLVED.xml
          defined-component/prop[@value] where name=allows-authenticated-scan:
            allowed_values:
            - 'yes'
            - 'no'
            allow_other: false
            definitions:
            - value: 'yes'
              description: The component allows an authenticated scan.
            - value: 'no'
              description: The component does not allow an authenticated scan.
            constraint_ids:
            - oscal-component-allows-authenticated-scan-value
            source_files:
            - oscal_component_metaschema_RESOLVED.xml
            conditions:
              name: allows-authenticated-scan
          defined-component/prop[@value] where name=asset-type:
            allowed_values:
            - operating-system
            - database
            - web-server
            - dns-server
            - email-server
            - directory-server
            - pbx
            - firewall
            - router
            - switch
            - storage-array
            - appliance
            allow_other: true
            definitions:
            - value: operating-system
              description: System software that manages computer hardware, software resources, and provides common services
                for computer programs.
            - value: database
              description: An electronic collection of data, or information, that is specially organized for rapid search
                and retrieval.
            - value: web-server
              description: A system that delivers content or services to end users over the Internet or an intranet.
            - value: dns-server
              description: A system that resolves domain names to internet protocol (IP) addresses.
            - value: email-server
              description: A computer system that sends and receives electronic mail messages.
            - value: directory-server
              description: A  system that stores, organizes and provides access to directory information in order to unify
                network resources.
            - value: pbx
              description: A private branch exchange (PBX) provides a a private telephone switchboard.
            - value: firewall
              description: A network security system that monitors and controls incoming and outgoing network traffic based
                on predetermined security rules.
            - value: router
              description: A physical or virtual networking device that forwards data packets between computer networks.
            - value: switch
              description: A physical or virtual networking device that connects devices within a computer network by using
                packet switching to receive and forward data to the destination device.
            - value: storage-array
              description: A consolidated, block-level data storage capability.
            - value: appliance
              description: A physical or virtual machine that centralizes hardware, software, or services for a specific purpose.
            constraint_ids:
            - oscal-component-asset-type-value
            source_files:
            - oscal_component_metaschema_RESOLVED.xml
            conditions:
              name: asset-type
          defined-component/prop[@value] where name=implementation-point:
            allowed_values:
            - internal
            - external
            allow_other: false
            definitions:
            - value: internal
              description: The component is implemented within the system boundary.
            - value: external
              description: The component is implemented outside the system boundary.
            constraint_ids:
            - oscal-component-implementation-point-value
            source_files:
            - oscal_component_metaschema_RESOLVED.xml
            conditions:
              name: implementation-point
          defined-component/prop[@value] where name=public:
            allowed_values:
            - 'yes'
            - 'no'
            allow_other: false
            definitions:
            - value: 'yes'
              description: The component is publicly accessible.
            - value: 'no'
              description: The component is not publicly accessible.
            constraint_ids:
            - oscal-component-public-value
            source_files:
            - oscal_component_metaschema_RESOLVED.xml
            conditions:
              name: public
          defined-component/prop[@value] where name=virtual:
            allowed_values:
            - 'yes'
            - 'no'
            allow_other: false
            definitions:
            - value: 'yes'
              description: The component is virtualized.
            - value: 'no'
              description: The component is not virtualized.
            constraint_ids:
            - oscal-component-virtual-value
            source_files:
            - oscal_component_metaschema_RESOLVED.xml
            conditions:
              name: virtual
      oscal-control-common:
        parameter/prop:
          parameter/prop[@name]:
            allowed_values:
            - label
            - sort-id
            - alt-identifier
            - alt-label
            allow_other: false
            definitions:
            - value: label
              description: A human-readable label for the parent context, which may be rendered in place of the actual identifier
                for some use cases.
            - value: sort-id
              description: An alternative identifier, whose value is easily sortable among other such values in the document.
            - value: alt-identifier
              description: An alternate or aliased identifier for the parent context.
            - value: alt-label
              description: An alternate to the value provided by the parameter's label. This will typically be qualified by
                a class.
            constraint_ids:
            - oscal-parameter-prop-name
            source_files:
            - oscal_control-common_metaschema_RESOLVED.xml
        part/prop:
          part/prop[@name]:
            allowed_values:
            - label
            - sort-id
            - alt-identifier
            allow_other: false
            definitions:
            - value: label
              description: A human-readable label for the parent context, which may be rendered in place of the actual identifier
                for some use cases.
            - value: sort-id
              description: An alternative identifier, whose value is easily sortable among other such values in the document.
            - value: alt-identifier
              description: An alternate or aliased identifier for the parent context.
            constraint_ids:
            - oscal-part-prop-name
            source_files:
            - oscal_control-common_metaschema_RESOLVED.xml
      oscal-implementation-common:
        '@type=''interconnection'']/prop':
          '@type=''interconnection'']/prop[@name]':
            allowed_values:
            - isa-title
            - isa-date
            - isa-remote-system-name
            - ipv4-address
            - ipv6-address
            - direction
            - uri
            - fqdn
            allow_other: false
            definitions:
            - value: isa-title
              description: Title of the Interconnection Security Agreement (ISA).
            - value: isa-date
              description: Date of the Interconnection Security Agreement (ISA).
            - value: isa-remote-system-name
              description: The name of the remote interconnected system.
            - value: ipv4-address
