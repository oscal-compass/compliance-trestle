            - office
            - job-title
            - keywords
            allow_other: false
            definitions:
            - value: type
              description: Characterizes the kind of location.
            - value: mail-stop
              description: A mail stop associated with the party.
            - value: office
              description: The name or number of the party's office.
            - value: job-title
              description: The formal job title of a person.
            - value: keywords
              description: The value identifies a comma-seperated listing of keywords associated with this content. These
                keywords may be used as search terms for indexing and other applications.
            constraint_ids:
