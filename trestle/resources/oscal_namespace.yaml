            - oscal-metadata-party-prop-name-values
            - oscal-metadata-prop-name-values
            source_files:
            - oscal_metadata_metaschema_RESOLVED.xml
          metadata/prop[@value] where name=type:
            allowed_values:
            - data-center
            allow_other: true
            definitions:
            - value: data-center
              description: A location that contains computing assets. A class can be used to indicate the sub-type of data-center
                as primary or alternate.
            constraint_ids:
            - oscal-metadata-location-prop-type-values
            source_files:
            - oscal_metadata_metaschema_RESOLVED.xml
