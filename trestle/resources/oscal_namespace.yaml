            - alternate
            allow_other: true
            definitions:
            - value: primary
              description: The location is a data-center used for normal operations.
            - value: alternate
              description: The location is a data-center used for fail-over or backup operations.
            constraint_ids:
            - oscal-metadata-location-prop-type-data-center-values
            source_files:
            - oscal_metadata_metaschema_RESOLVED.xml
