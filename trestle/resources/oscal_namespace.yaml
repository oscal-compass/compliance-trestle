      oscal-mapping-common:
        confidence-score/category:
          confidence-score/category:
            allowed_values:
            - unspecified
            - high
            - medium
            - low
            allow_other: true
            definitions:
            - value: unspecified
              description: No category is specified for the confidence score.
            - value: high
              description: High confidence in the mapping.
            - value: medium
              description: Medium confidence in the mapping.
            - value: low
              description: Low confidence in the mapping.
            constraint_ids:
            - ''
            source_files:
            - oscal_mapping-common_metaschema_RESOLVED.xml
        map/relationship:
          map/relationship:
            allowed_values:
            - equivalent-to
            - equal-to
            - subset-of
            - superset-of
            - intersects-with
            - no-relationship
            allow_other: false
            definitions:
            - value: equivalent-to
              description: "The source and target\n                            requirements are similar, although not necessarily\
                \ identical. The words\n                            may differ, but both mapped sets convey similar information\
                \ with the\n                            same effective meaning. This relationship may be reversed, since `A\n\
                \                            equivalent-to B` also means that `B equivalent-to A`. This relationship\n   \
                \                         is less suitable for a syntactic\n                     matching-rationale\n    \
                \                        ."
            - value: equal-to
              description: "The source and target\n                            requirements are the same. Differences in capitalization,\
                \ spelling, and\n                            grammar can be ignored, if these differences do not change the\
                \ meaning.\n                            This relationship may be reversed, since `A equal-to B` also means\
                \ that\n                            `B equal-to A`."
            - value: subset-of
              description: "The source requirements are a subset of \n                            target requirements. In\
                \ other words, target contains\n                            all sourcerequirements and aditional others. This\n\
                \                            relationship may be reversed as a `superset-of`, since `A subset-of B`\n    \
                \                        also means that `B superset-of A`."
            - value: superset-of
              description: "The source requirements are a\n                            superset of target requirements. In\
                \ other words, \n                            source contains all targetrequirements and aditional\n      \
                \                      others. This relationship may be reversed as a `subset-of`, since `A\n            \
                \                superset-of B` also means that `B subset-of A`."
            - value: intersects-with
              description: "The source and target\n                            requirements have some overlap, but each includes\
                \ content that the other\n                            does not. This relationship may be reversed, since `A\
                \ intersects-with B`\n                            also means that `B intersects-with A`. A mapping at statement\
                \ level\n                            could result on relationships mapping that allows for more\n        \
                \                    inference than using this relationship type."
            - value: no-relationship
              description: "The source and target\n                            requirements are not related; their content\
                \ does not overlap. This\n                            relation is introduced not with the intention to support\
                \ exhaustiv\n                            mapping of all requirements and statements that have no overlap,\
                \ but\n                            rather to support edge cases such is the need to tailor a \n          \
                \                  relationship in the context of a component or system to better\n                      \
                \      align with the implementation and configuration of the respective\n                            component\
                \ or system. Also, this relationship is provided in\n                            support of the NIST IR\n\
                \                            8477."
            constraint_ids:
            - ''
            source_files:
            - oscal_mapping-common_metaschema_RESOLVED.xml
