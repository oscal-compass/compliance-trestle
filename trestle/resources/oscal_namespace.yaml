              description: Indicates the resource represents machine data, which may require a tool or analysis for interpretation
                or presentation.
            - value: interview-notes
              description: Indicates the resource represents notes from an interview, such as may be collected during an assessment.
            - value: questionnaire
              description: Indicates the resource is a set of questions, possibly with responses.
            - value: report
              description: Indicates the resource is a report.
            - value: agreement
              description: Indicates the resource is a formal agreement between two or more parties.
            constraint_ids:
            - oscal-back-matter-resource-prop-type-values
            source_files:
            - oscal_metadata_metaschema_RESOLVED.xml
