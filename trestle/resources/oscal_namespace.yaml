            - other
            allow_other: false
            definitions:
            - value: saas
              description: Software as a service (SaaS) cloud service model as defined by The NIST Definition of Cloud Computing.
            - value: paas
              description: Platform as a service (PaaS) cloud service model as defined by The NIST Definition of Cloud Computing.
            - value: iaas
              description: Infrastructure as a service (IaaS) cloud service model as defined by The NIST Definition of Cloud
                Computing.
            - value: other
              description: Any other type of cloud service model that is exclusive to the other choices.
            constraint_ids:
            - oscal-system-characteristics-prop-cloud-service-model-values
            source_files:
            - oscal_ssp_metaschema_RESOLVED.xml
            conditions:
              name: cloud-service-model
