            - authenticator-assurance-level
            - federation-assurance-level
            - cloud-deployment-model
            - cloud-service-model
            allow_other: false
            definitions:
            - value: identity-assurance-level
              description: A value of 1, 2, or 3 as defined by SP 800-63-3.
            - value: authenticator-assurance-level
              description: A value of 1, 2, or 3 as defined by SP 800-63-3.
            - value: federation-assurance-level
              description: A value of 1, 2, or 3 as defined by SP 800-63-3.
            - value: cloud-deployment-model
              description: 'The associated value is one of: public-cloud, private-cloud, community-cloud, government-only-cloud,
                hybrid-cloud, or other.'
            - value: cloud-service-model
              description: 'The associated value is one of: saas, paas, iaas, or other.'
            constraint_ids:
            - oscal-system-characteristics-prop-name-values
            - oscal-system-characteristics-prop-name-values
            source_files:
            - oscal_ssp_metaschema_RESOLVED.xml
          system-characteristics/prop[@value] where name=cloud-deployment-model:
            allowed_values:
            - public-cloud
            - private-cloud
            - community-cloud
            - hybrid-cloud
            - government-only-cloud
            - other
            allow_other: false
            definitions:
            - value: public-cloud
              description: The public cloud deployment model as defined by The NIST Definition of Cloud Computing.
            - value: private-cloud
              description: The private cloud deployment model as defined by The NIST Definition of Cloud Computing.
            - value: community-cloud
              description: The community cloud deployment model as defined by The NIST Definition of Cloud Computing.
            - value: hybrid-cloud
              description: The hybrid cloud deployment model as defined by The NIST Definition of Cloud Computing.
            - value: government-only-cloud
              description: A specific type of community-cloud for use only by government services.
            - value: other
              description: Any other type of cloud deployment model that is exclusive to the other choices.
            constraint_ids:
            - oscal-system-characteristics-prop-cloud-deployment-model-values
            source_files:
