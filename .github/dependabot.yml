version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: fix
      include: scope
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/init"
          - "github/codeql-action/analyze"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: fix
      include: scope
    open-pull-requests-limit: 10
