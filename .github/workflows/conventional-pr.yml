name: "Lint PR title"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - 'main'
      - 'develop'
      - 'v[0-9]*'
permissions:
  contents: read

jobs:
  lint:
    if: ${{ github.head_ref != 'develop' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install dependencies
      run: npm install @commitlint/cli @commitlint/config-conventional

    - name: Validate PR title
      run: |
        PR_TITLE=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
        echo "$PR_TITLE" | npx commitlint --config commitlint.config.js

    - name: Block feature commits on maintenance branches
      if: startsWith(github.base_ref, 'v')
      run: |
        PR_TITLE=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH" | head -1 | sed 's/^[[:space:]]*//')
        if echo "$PR_TITLE" | grep -qiE '^feat(\(.*\))?!?:'; then
          echo "::error::Feature commits (feat:) are not allowed on maintenance branches. Only fix: and perf: are permitted."
          exit 1
        fi
