name: Verify Sign-off

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  verify-signoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify every commit is signed off with a GitHub-linked email
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          FAIL=0

          # Walk every non-merge commit introduced by this PR
          while IFS= read -r COMMIT; do
            AUTHOR_NAME=$(git log -1 --format='%an' "$COMMIT")
            AUTHOR_EMAIL=$(git log -1 --format='%ae' "$COMMIT")
            SIGNOFFS=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$COMMIT")

            echo "----------------------------------------"
            echo "Commit:      $COMMIT"
            echo "Author:      $AUTHOR_NAME <$AUTHOR_EMAIL>"
            echo "Signed-off:  ${SIGNOFFS:-<none>}"

            # 1. Reject missing signoff outright
            if [ -z "$SIGNOFFS" ]; then
              echo "::error::Commit $COMMIT is missing a Signed-off-by trailer."
              FAIL=1
              continue
            fi

            # 2. At least one Signed-off-by trailer must match the commit author
            #    email. DCO requires the author to have signed off their own work.
            #    Additional co-signers (e.g. a maintainer) are permitted alongside.
            AUTHOR_SIGNED=0
            while IFS= read -r SIGNOFF; do
              [ -z "$SIGNOFF" ] && continue
              SIGNOFF_EMAIL=$(echo "$SIGNOFF" | sed 's/.*<\(.*\)>/\1/')
              if [ "$SIGNOFF_EMAIL" = "$AUTHOR_EMAIL" ]; then
                AUTHOR_SIGNED=1
                break
              fi
            done <<< "$SIGNOFFS"

            if [ "$AUTHOR_SIGNED" -eq 0 ]; then
              echo "::error::Commit $COMMIT — no Signed-off-by trailer matches the commit author email."
              echo "::error::  Author email: $AUTHOR_EMAIL"
              FAIL=1
              continue
            fi

            # 3. Resolve the commit author's GitHub login via the Commits API —
            #    the authoritative source for which account authenticated the push.
            COMMIT_DATA=$(gh api "repos/${{ github.repository }}/commits/${COMMIT}")
            LOGIN=$(echo "$COMMIT_DATA" | jq -r '.author.login // empty')

            if [ -z "$LOGIN" ]; then
              echo "::error::Commit $COMMIT — cannot resolve a GitHub account (unlinked email). Signoff cannot be verified."
              FAIL=1
              continue
            fi

            USER_ID=$(gh api "users/${LOGIN}" --jq '.id')
            NOREPLY_EMAIL="${USER_ID}+${LOGIN}@users.noreply.github.com"
            GITHUB_AUTHOR_EMAIL=$(echo "$COMMIT_DATA" | jq -r '.commit.author.email // empty')

            # 4. The author's Signed-off-by email must be linked to their GitHub
            #    account — matching either the no-reply address or the email GitHub
            #    recorded when it accepted the push. This rejects emails that are
            #    not verifiably associated with the account that pushed the commit.
            if [ "$AUTHOR_EMAIL" = "$NOREPLY_EMAIL" ] || [ "$AUTHOR_EMAIL" = "$GITHUB_AUTHOR_EMAIL" ]; then
              echo "✅ PASS: $AUTHOR_EMAIL is linked to GitHub account ${LOGIN}"
            else
              echo "::error::Commit $COMMIT — author email is not linked to the GitHub account that pushed this commit."
              echo "::error::  Author email:  $AUTHOR_EMAIL"
              echo "::error::  No-reply addr: $NOREPLY_EMAIL"
              echo "::error::  Linked email:  $GITHUB_AUTHOR_EMAIL"
              FAIL=1
            fi
          done < <(git log --no-merges --format='%H' "${BASE_SHA}..${HEAD_SHA}")

          echo "----------------------------------------"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more commits failed DCO verification."
            echo "::error::Fix: git config user.email \"<id>+<username>@users.noreply.github.com\" && git commit --amend --signoff"
            exit 1
          fi
          echo "All commits passed DCO verification."
