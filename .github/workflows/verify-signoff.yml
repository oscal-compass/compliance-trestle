name: Verify Sign-off

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  verify-signoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify every commit is signed off with a GitHub-linked email
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          FAIL=0

          # Walk every non-merge commit introduced by this PR
          while IFS= read -r COMMIT; do
            AUTHOR_NAME=$(git log -1 --format='%an' "$COMMIT")
            AUTHOR_EMAIL=$(git log -1 --format='%ae' "$COMMIT")
            SIGNOFFS=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$COMMIT")

            echo "----------------------------------------"
            echo "Commit:      $COMMIT"
            echo "Author:      $AUTHOR_NAME <$AUTHOR_EMAIL>"
            echo "Signed-off:  ${SIGNOFFS:-<none>}"

            # 1. Reject missing signoff outright
            if [ -z "$SIGNOFFS" ]; then
              echo "::error::Commit $COMMIT is missing a Signed-off-by trailer."
              FAIL=1
              continue
            fi

            # Resolve this commit's GitHub login and email once — reused for
            # every Signed-off-by trailer on this commit.
            COMMIT_DATA=$(gh api "repos/${{ github.repository }}/commits/${COMMIT}")
            LOGIN=$(echo "$COMMIT_DATA" | jq -r '.author.login // empty')

            if [ -z "$LOGIN" ]; then
              echo "::error::Commit $COMMIT — cannot resolve a GitHub account (unlinked email). Signoff cannot be verified."
              FAIL=1
              continue
            fi

            USER_ID=$(gh api "users/${LOGIN}" --jq '.id')
            NOREPLY_EMAIL="${USER_ID}+${LOGIN}@users.noreply.github.com"
            GITHUB_AUTHOR_EMAIL=$(echo "$COMMIT_DATA" | jq -r '.commit.author.email // empty')

            # Check every Signed-off-by trailer on this commit
            while IFS= read -r SIGNOFF; do
              [ -z "$SIGNOFF" ] && continue

              SIGNOFF_EMAIL=$(echo "$SIGNOFF" | sed 's/.*<\(.*\)>/\1/')

              # 2. The Signed-off-by email must match the commit author email (DCO
              #    requires the signer to be the author — not a third party signing
              #    on someone else's behalf).
              if [ "$SIGNOFF_EMAIL" != "$AUTHOR_EMAIL" ]; then
                echo "::error::Commit $COMMIT — Signed-off-by email does not match the commit author email."
                echo "::error::  Author email:  $AUTHOR_EMAIL"
                echo "::error::  Signoff email: $SIGNOFF_EMAIL"
                FAIL=1
                continue
              fi

              # 3. The Signed-off-by email must match either:
              #    a) the GitHub-issued no-reply address for this account, or
              #    b) the email GitHub itself recorded for this push (confirmed as
              #       linked to the account that authenticated the push).
              #    This allows personal emails that are linked to the GitHub account
              #    while rejecting emails with no verifiable association.
              if [ "$SIGNOFF_EMAIL" = "$NOREPLY_EMAIL" ] || [ "$SIGNOFF_EMAIL" = "$GITHUB_AUTHOR_EMAIL" ]; then
                echo "✅ PASS: signoff email is linked to GitHub account ${LOGIN}"
              else
                echo "::error::Commit $COMMIT — Signed-off-by email is not linked to the GitHub account that pushed this commit."
                echo "::error::  Got:           $SIGNOFF"
                echo "::error::  No-reply addr: $NOREPLY_EMAIL"
                echo "::error::  Linked email:  $GITHUB_AUTHOR_EMAIL"
                FAIL=1
              fi
            done <<< "$SIGNOFFS"
          done < <(git log --no-merges --format='%H' "${BASE_SHA}..${HEAD_SHA}")

          echo "----------------------------------------"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more commits failed DCO verification."
            echo "::error::Fix: git config user.email \"<id>+<username>@users.noreply.github.com\" && git commit --amend --signoff"
            exit 1
          fi
          echo "All commits passed DCO verification."
